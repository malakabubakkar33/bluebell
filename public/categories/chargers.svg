<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <filter id="chargerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0284C7" flood-opacity="0.22" />
    </filter>
  </defs>

  <g filter="url(#chargerShadow)">
    <!-- USB-C Braided Cable Looping Around -->
    <path d="M 24 75 C 16 95, 45 108, 68 100 C 95 90, 102 68, 88 50 C 78 38, 55 42, 58 58 C 60 70, 78 72, 85 64" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Cable end connector -->
    <rect x="84" y="60" width="12" height="6" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="0.6" transform="rotate(-25, 84, 60)" />
    <!-- Metal USB-C tip -->
    <rect x="94" y="58" width="5" height="3" rx="1" fill="#CBD5E1" transform="rotate(-25, 94, 58)" />

    <!-- 20W Power Adapter Brick -->
    <rect x="36" y="24" width="46" height="46" rx="10" fill="url(#brickGrad)" stroke="#CBD5E1" stroke-width="0.8" />
    
    <!-- Power prongs top (retracted or UK/US style) -->
    <rect x="46" y="14" width="6" height="11" rx="1.5" fill="#94A3B8" />
    <rect x="66" y="14" width="6" height="11" rx="1.5" fill="#94A3B8" />
    
    <!-- USB-C Port Openings on front surface -->
    <rect x="52" y="52" width="14" height="4.5" rx="2.2" fill="#334155" />
    <rect x="56" y="53.5" width="6" height="1.5" rx="0.7" fill="#64748B" />
    
    <!-- Lightning Bolt Quick Charge Badge -->
    <path d="M 59 34 L 54 42 L 58 42 L 57 48 L 64 39 L 60 39 Z" fill="#3B82F6" />
  </g>
</svg>
