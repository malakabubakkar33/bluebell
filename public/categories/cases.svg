<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="caseOutline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.1" />
    </linearGradient>
    <filter id="caseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0284C7" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#caseGlow)">
    <!-- Transparent Protective Case Outer Bumper -->
    <rect x="36" y="12" width="48" height="96" rx="14" fill="url(#glassBody)" stroke="url(#caseOutline)" stroke-width="2" />
    
    <!-- Camera Plateau Cutout top left -->
    <rect x="40" y="16" width="22" height="24" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
    <!-- 3 Camera Ring Openings -->
    <circle cx="46" cy="22" r="3.5" fill="#1E293B" stroke="#60A5FA" stroke-width="1" />
    <circle cx="46" cy="33" r="3.5" fill="#1E293B" stroke="#60A5FA" stroke-width="1" />
    <circle cx="56" cy="28" r="3.5" fill="#1E293B" stroke="#60A5FA" stroke-width="1" />
    <!-- Flash dot -->
    <circle cx="56" cy="19" r="1.5" fill="#FDE047" />

    <!-- MagSafe Magnetic Array Ring in center -->
    <circle cx="60" cy="64" r="15" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="3.5 1.5" fill="none" opacity="0.9" />
    <!-- MagSafe alignment vertical pill at bottom -->
    <rect x="58.5" y="82" width="3" height="7" rx="1.5" fill="#FFFFFF" opacity="0.9" />

    <!-- Glass Reflection Diagonal Sheen -->
    <path d="M 40 14 L 80 14 Q 40 50 40 98 Z" fill="#FFFFFF" opacity="0.15" />
  </g>
</svg>
