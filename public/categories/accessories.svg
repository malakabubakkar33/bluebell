<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="budGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="accShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0284C7" flood-opacity="0.22" />
    </filter>
  </defs>

  <g filter="url(#accShadow)">
    <!-- Wireless Charging Case -->
    <rect x="36" y="44" width="48" height="42" rx="18" fill="url(#caseGrad)" stroke="#CBD5E1" stroke-width="0.8" />
    <!-- Lid separation seam -->
    <path d="M 36 58 Q 60 61 84 58" stroke="#94A3B8" stroke-width="0.75" fill="none" />
    <!-- LED Indicator Light -->
    <circle cx="60" cy="67" r="1.5" fill="#22C55E" />
    
    <!-- Left Earbud floating up -->
    <g transform="translate(26, 14) rotate(-15)">
      <ellipse cx="14" cy="14" rx="8" ry="7" fill="url(#budGrad)" stroke="#CBD5E1" stroke-width="0.6" />
      <!-- Silicon tip -->
      <ellipse cx="9" cy="16" rx="4" ry="5" fill="#94A3B8" />
      <!-- Black acoustic mesh -->
      <ellipse cx="16" cy="12" rx="2" ry="3" fill="#334155" />
      <!-- Stem -->
      <rect x="13" y="17" width="4" height="15" rx="2" fill="url(#budGrad)" stroke="#CBD5E1" stroke-width="0.5" />
      <!-- Silver contact at bottom -->
      <rect x="13.2" y="30" width="3.6" height="2" rx="0.8" fill="#94A3B8" />
    </g>

    <!-- Right Earbud floating up -->
    <g transform="translate(68, 12) rotate(15)">
      <ellipse cx="14" cy="14" rx="8" ry="7" fill="url(#budGrad)" stroke="#CBD5E1" stroke-width="0.6" />
      <!-- Silicon tip -->
      <ellipse cx="19" cy="16" rx="4" ry="5" fill="#94A3B8" />
      <!-- Black acoustic mesh -->
      <ellipse cx="12" cy="12" rx="2" ry="3" fill="#334155" />
      <!-- Stem -->
      <rect x="11" y="17" width="4" height="15" rx="2" fill="url(#budGrad)" stroke="#CBD5E1" stroke-width="0.5" />
      <!-- Silver contact -->
      <rect x="11.2" y="30" width="3.6" height="2" rx="0.8" fill="#94A3B8" />
    </g>

    <!-- Sound waves / ambient audio rings -->
    <path d="M 22 28 A 12 12 0 0 1 20 40" stroke="#0284C7" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
    <path d="M 98 28 A 12 12 0 0 0 100 40" stroke="#0284C7" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
