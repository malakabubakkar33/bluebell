<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="watchTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="watchOLED" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="watchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#F97316" flood-opacity="0.28" />
    </filter>
  </defs>

  <g filter="url(#watchShadow)">
    <!-- Top Strap Band -->
    <path d="M 46 8 L 74 8 L 72 32 L 48 32 Z" fill="url(#bandGrad)" />
    <!-- Bottom Strap Band -->
    <path d="M 48 88 L 72 88 L 74 112 L 46 112 Z" fill="url(#bandGrad)" />
    
    <!-- Watch Case (Ultra Titanium Squircle) -->
    <rect x="36" y="30" width="48" height="60" rx="18" fill="url(#watchTitanium)" stroke="#CBD5E1" stroke-width="0.8" />
    
    <!-- Digital Crown on right -->
    <rect x="83.5" y="44" width="4.5" height="12" rx="2" fill="#F97316" stroke="#94A3B8" stroke-width="0.5" />
    <!-- Side Action Button -->
    <rect x="83.5" y="64" width="3" height="14" rx="1.5" fill="#64748B" />

    <!-- Left Orange Action Button -->
    <rect x="33" y="50" width="3.5" height="16" rx="1.7" fill="#F97316" />

    <!-- OLED Glass Screen -->
    <rect x="40" y="34" width="40" height="52" rx="14" fill="url(#watchOLED)" />
    
    <!-- Activity Rings Graphic on Screen -->
    <!-- Red/Orange outer ring -->
    <circle cx="60" cy="56" r="14" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="70 20" stroke-linecap="round" fill="none" />
    <!-- Green middle ring -->
    <circle cx="60" cy="56" r="10" stroke="#22C55E" stroke-width="2.5" stroke-dasharray="50 15" stroke-linecap="round" fill="none" />
    <!-- Blue inner ring -->
    <circle cx="60" cy="56" r="6" stroke="#06B6D4" stroke-width="2" stroke-dasharray="30 10" stroke-linecap="round" fill="none" />

    <!-- Digital Time Display -->
    <text x="60" y="77" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">09:41</text>
  </g>
</svg>
